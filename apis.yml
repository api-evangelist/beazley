- aid: beazley:beazley-compliance-web-api
  name: Beazley Compliance Web API
  description: Compliance validation and search for Beazley's underwriting systems.
    Runs rule-driven compliance checks determined by system and action parameters,
    searches broker agencies, broker contacts and product lines, returns audit reports
    of compliance checks performed, exposes audit lookup registries, and provides a
    system health check across the validation engine and databases.
