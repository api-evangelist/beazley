aid: beazley
url: https://raw.githubusercontent.com/api-evangelist/beazley/refs/heads/main/apis.yml
name: Beazley
kind: company
description: Beazley plc is a London-headquartered specialty insurer and one of the
  largest managing agents at Lloyd's of London, underwriting through Lloyd's syndicates
  alongside US admitted and surplus lines carriers and a European company platform.
  Its book is specialty property and casualty — cyber and technology risks (where it
  is a global market leader), professional indemnity, management liability and directors
  and officers, marine, political risk, contingency, environmental, healthcare and
  property. Its home market is the United Kingdom, where there is no open-insurance
  mandate; the only market-wide data and API modernization effort is the Lloyd's
  Blueprint Two programme, and Beazley sat on the closed beta group that tested
  Lloyd's ACORD-based Core Data Record. Unusually for a carrier, Beazley operates a
  real first-party developer portal at developer.beazley.com — an Azure API Management
  portal with self-serve account signup, a publicly browsable catalog of 14 published
  APIs across nine families, sandbox environments, and machine-readable OpenAPI 3.0.1
  for every one of them. The APIs are partner-and-broker oriented rather than consumer
  facing — risk and quote data capture into Beazley's core Record of Risk systems,
  broker and insured marketing data, compliance validation, currency exchange, a
  cyber rater, and insurance-terms reference data. Every API is behind an Azure APIM
  subscription key and every product carries approvalRequired, so browsing and spec
  download are open but actually calling the gateway requires Beazley to approve the
  subscription. There is no ACORD, AL3 or IVANS reference anywhere in the portal or
  the specs, no webhook or event catalog, no GraphQL, and no bind, issue or FNOL
  endpoint — bind is done by brokers through the gated myBeazley quote-and-bind
  portal, not through the public API surface. Beazley is subject to a recommended
  all-cash offer from Zurich Insurance Group announced 2 March 2026.
