  name: 'Beazley Data Capture: Quote and Risk Data v2'
  description: The current published version of Beazley's risk data capture API. Provides
    a channel for partner systems to feed quote and risk data directly into Beazley's
    core Record of Risk systems, with create, read and update of risk records plus a
    lock-state resource for concurrency control. Partner-facing, subscription-key
    authenticated, and gated behind an approval-required Azure APIM product.
