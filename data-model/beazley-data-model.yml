missing_from_the_model:
  - Policy — no policy entity, no issuance and no policy administration operation exists in the public catalog.
  - Bind — binding happens in the gated myBeazley broker portal, not through a documented API.
  - Claim / FNOL — claims are notified by web form and email; no claim entity exists.
  - Premium / Quote document — the raters return a rating, but no quote document entity is exposed.
