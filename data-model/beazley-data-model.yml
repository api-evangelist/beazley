description: >-
  The entity graph behind the Beazley API surface, derived from the published contracts. Only one of
  the fourteen specs (Compliance Web API) declares components.schemas at all — the other thirteen are
  Azure API Management exports with untyped request and response bodies — so the graph is built
  mainly from path structure and path/query parameters, and the schema-level detail below is
  Compliance-only. There is no id-prefix convention, no shared identifier scheme across families, and
  no cross-family reference: risk, organisation, contact and person ids live in different systems and
  never appear in each other's payloads.
