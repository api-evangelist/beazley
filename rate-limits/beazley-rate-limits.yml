description: >-
  Beazley publishes a per-product call allowance in the description of every Azure API Management
  product on its developer portal. The limits are stated in prose rather than served as a policy
  document or advertised in response headers, but they are explicit, per-product and quotable. Rate
  limiting is enforced at the APIM gateway against the subscription key; no RateLimit-* or
  X-RateLimit-* response headers are documented, and none could be observed anonymously because every
  product is approval-gated.
