aid: beazley
name: Beazley
review:
  question: Does Beazley expose a real, self-serve public developer portal and
    downloadable API specifications, and what is its ACORD posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: carrier-pc
findings:
  summary: |
    Beazley is an outlier for a specialty property and casualty carrier: it runs a
    genuine first-party developer portal at https://developer.beazley.com (HTTP 200),
    built on Microsoft Azure API Management. It is NOT a login wall and NOT a
    marketing "innovation" page. The portal has open navigation to /apis and
    /products, a self-serve /signup form (email and password with proof-of-work
    captcha, no partner SSO required to create an account), and its full catalog is
    anonymously enumerable through the APIM developer-portal management endpoint
    declared in the portal's own /config.json. Fourteen published APIs across nine
    families were enumerated and all fourteen exported as valid OpenAPI 3.0.1.

    The important nuance is that browsing is open but calling is not. Every one of
    the nine published APIM products carries subscriptionRequired=true AND
    approvalRequired=true, and the live gateway at https://api.beazley.com confirms
    it: an unauthenticated GET to /about/v1/people returns HTTP 401 with
    WWW-Authenticate: AzureApiManagementKey realm="https://api.beazley.com/about/v1",
    name="Ocp-Apim-Subscription-Key", type="header". So a developer can sign up and
    read every specification without asking anyone, but cannot obtain a working key
    without Beazley approving the subscription. Portal is real and open; runtime
    access is partner-gated.

    The API family is partner-and-broker oriented, not consumer facing. The center of
    gravity is "Data Capture: Quote and Risk Data" (v1, v2, and a v3 pre-release),
    described in Beazley's own words as "a channel for partner systems to feed quote
    and risk data directly into Beazley's core Record of Risk systems." Around it sit
    Compliance (rule-driven compliance checks, broker agency and contact search,
    audit reporting), Broker and Insured Marketing Data v2 (organisations, contacts,
    microsites), Currency Exchange (rates, providers, currencies), About Beazley
    (people and divisions reference data), Fast Reader (insurance-terms glossary and
    FAQs), and Simple Raters (a single POST /Cyber rating operation, explicitly
    labelled "super-simple raters for testing"). Six of the fourteen published APIs
    are sandbox twins on https://api.beazley.com/sandbox/*, which is real sandbox
    provisioning most carriers do not offer.

    On the four insurance verbs, the honest reading is: QUOTE is partially exposed —
    quote and risk data can be pushed into Beazley's systems via risk capture, and a
    cyber rating endpoint exists but is self-described as a test rater. BIND, ISSUE
    and FNOL are NOT exposed on the public API surface at all. Beazley's own product
    pages list "APIs - direct system integration" as one of several placement
    channels alongside myBeazley, which they describe as their broker "quote and bind
    platform." myBeazley.com redirects (HTTP 200) to https://www.beazley.com/en-gb/log/,
    a broker login wall. So bind actually happens in a gated broker portal, not
    through a documented API. Claims notification is a "Notify a Claim" web form and
    an email address, not an API.

    ACORD posture: no ACORD reference found in the developer portal or specs. A
    case-insensitive grep for acord, AL3, ACORD XML, NGDS, IVANS, Vertafore and
    Applied Epic across all fourteen harvested OpenAPI documents and across the full
    APIM api and product metadata (including the portal terms of use) returned zero
    hits. The only ACORD linkage is market-level and indirect: Beazley is named in
    Lloyd's press material as one of seventeen firms in the closed beta group that
    tested the Blueprint Two Core Data Record, which Lloyd's states is based on ACORD
    Standards. That is Lloyd's programme participation, not a Beazley-published
    ACORD interface. This is exactly the UK market seam — the London Market's real
    data-standards work (Blueprint Two, PPL, Whitespace, Ki) is aimed at brokers and
    syndicates and is invisible from a developer's vantage point.

    No webhooks, no event catalog, no AsyncAPI, no GraphQL, no gRPC or .proto, and no
    public Postman collection or workspace were found. No OpenID Connect or OAuth
    authorization-server metadata is served: https://www.beazley.com/.well-known/openid-configuration
    and /.well-known/oauth-authorization-server both fall through to the site's 404
    page. Auth is API key only.
