actions:
  apisYmlUpdated: true
  openapiHarvested: true
  openapiCount: 14
  asyncapiCreated: false
  graphqlCreated: false
  reason: |
    Beazley publishes a real, self-serve, publicly browsable developer portal with
    machine-readable OpenAPI for all fourteen published APIs, so all fourteen were
    saved verbatim and nine apis[] entries were created (versions kept separate,
    sandbox twins attached to their production sibling). No AsyncAPI was authored
    because no event, webhook or streaming surface is documented anywhere. No GraphQL
    document was authored because no GraphQL API exists in the catalog. ACORD posture
    is recorded as absent from the first-party surface, with the Lloyd's Blueprint Two
    linkage noted as market-level only and explicitly not attributed to Beazley as a
    published interface.
