    - url: https://beazley.azure-api.net/
      httpStatus: 404
      note: Default APIM gateway hostname resolves; root unrouted.
    - url: https://www.beazley.com/developers
      httpStatus: 200
      note: Redirects to https://www.beazley.com/en-us/404-error-page/ — not a real page.
    - url: https://www.beazley.com/api
      httpStatus: 200
      note: Redirects to https://www.beazley.com/en-us/404-error-page/ — not a real page.
