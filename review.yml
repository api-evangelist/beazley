    url: https://developer.beazley.com/
    httpStatus: 200
    platform: Microsoft Azure API Management developer portal
    classification: real self-serve developer portal
    loginWall: false
    selfServeSignup: true
    signupUrl: https://developer.beazley.com/signup
    catalogPubliclyBrowsable: true
    note: Portal is genuinely open to browse and to download specs. Every APIM
      product is approvalRequired=true, so a usable subscription key still requires
      Beazley approval.
