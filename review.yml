      httpStatus: 200
      note: Redirects to https://www.beazley.com/en-us/404-error-page/ — not a real page.
    - url: https://www.beazley.com/integrations
      httpStatus: 200
      note: Redirects to https://www.beazley.com/en-us/404-error-page/ — not a real page.
    - url: https://www.beazley.com/en-us/broker-centre
      httpStatus: 200
      note: Real page. Broker-facing, not developer-facing.
    - url: https://mybeazley.com/
      httpStatus: 200
      note: Redirects to https://www.beazley.com/en-gb/log/ — broker login wall for the
