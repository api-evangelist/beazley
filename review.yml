    - url: https://docs.beazley.com/
      httpStatus: 000
      note: DNS does not resolve.
    - url: https://api.beazley.com/
      httpStatus: 404
      note: Live APIM gateway custom domain; root path is unrouted but API paths respond.
    - url: https://api.beazley.com/about/v1/people
      httpStatus: 401
      note: 'WWW-Authenticate: AzureApiManagementKey realm="https://api.beazley.com/about/v1",
