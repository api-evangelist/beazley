    - url: https://www.beazley.com/.well-known/openid-configuration
      httpStatus: 200
      note: Falls through to the site 404 page. No OIDC metadata served.
    - url: https://www.beazley.com/.well-known/oauth-authorization-server
      httpStatus: 200
      note: Falls through to the site 404 page. No OAuth metadata served.
  acordPosture:
    phrase: no ACORD reference found in developer portal or specs; ACORD only reaches
      Beazley indirectly via Lloyd's Blueprint Two Core Data Record beta
    acordInSpecs: false
    acordInPortalMetadata: false
    al3: false
    ivans: false
    ngds: false
    marketLevelLinkage: Beazley is named by Lloyd's as one of seventeen firms in the
      closed beta group for the Blueprint Two Core Data Record, which Lloyd's states
      is based on ACORD Standards.
    marketLevelSource: https://www.lloyds.com/insights/media-centre/press-releases/lloyds-publishes-first-iteration-of-its-core-data-record-under-blueprint-two
  insuranceVerbs:
    quote:
      exposed: partial
      audience: partner
      note: 'Data Capture: Quote and Risk Data v1/v2/v3 pushes quote and risk data
        into Beazley''s core Record of Risk systems (POST/PUT /risks/). Simple Raters
        exposes POST /Cyber but is self-described as "super-simple raters for testing".'
    bind:
      exposed: false
      note: Bind happens in the gated myBeazley broker portal, described by Beazley as
        their "quote and bind platform". No bind endpoint is documented.
    issue:
      exposed: false
      note: No policy issuance or policy administration endpoint in the public catalog.
    fnol:
      exposed: false
      note: Claims are notified via a "Notify a Claim" web form and email. No FNOL API.
  authModel:
    scheme: API key
    schemeDetail: Azure API Management subscription key, sent as the
      Ocp-Apim-Subscription-Key header or the subscription-key query parameter.
    oauth2: false
    oidc: false
    mtls: not documented
    approvalRequired: true
    note: All nine APIM products are subscriptionRequired=true and
      approvalRequired=true; subscriptionsLimit is 1 on eight of nine.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.beazley.com
      documented: true
      note: All fourteen published APIs are HTTPS REST. Every OpenAPI declares
        protocols ["https"] only.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket API is published in the APIM catalog.
    - protocol: GraphQL
      documented: false
      note: No GraphQL API is published in the APIM catalog; no /graphql surface found.
    - protocol: gRPC
      documented: false
      note: No .proto or gRPC surface published.
    - protocol: Webhooks
      documented: false
      note: No webhook or event catalog, and no AsyncAPI, was found. Absence is the finding.
  postman:
    publicCollection: false
    publicWorkspace: false
    note: No public Beazley Postman collection or workspace found.
