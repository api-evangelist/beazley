generated: '2026-07-25'
method: searched
source: https://developer.beazley.com/apis
description: >-
  Beazley runs genuine sandbox provisioning, which is unusual for a specialty carrier. Six of the
  fourteen published APIs are sandbox twins served from https://api.beazley.com/sandbox/*, each with
  its own OpenAPI, its own APIM product and its own approval flow, and every production spec
  description explicitly tells developers to use the sandbox version "for initial development and
  testing". Two further APIs (Fast Reader, Simple Raters) are published sandbox-only. There is no
  test/live key prefix convention, no published test data, and no magic identifiers — sandbox and
  production are separated by base path and by product, not by a key mode.
separation:
  model: separate-host-path-and-product
  live_base: https://api.beazley.com/<family>/<version>
  test_base: https://api.beazley.com/sandbox/<family>/<version>
  key_prefixes: none
  key_modes: none
  note: >-
    An Azure APIM subscription key is scoped to a product, and Development and Production are
    different products, so a sandbox key simply cannot reach the production path.
console:
  available: true
  url: https://developer.beazley.com/apis
  note: >-
    The Azure API Management developer portal ships an interactive API console per operation with
    generated code samples in multiple languages. The console is browsable anonymously; issuing a
    request from it requires an approved subscription key.
environments:
  - name: 'Data Capture: Quote and Risk Data (Sandbox)'
