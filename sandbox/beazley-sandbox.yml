    base_url: https://api.beazley.com/sandbox/fastreader/v1
    openapi: openapi/beazley-fast-reader.yml
    product: Prerelease
    mirrors: null
    note: Published sandbox-only; there is no production Fast Reader path.
  - name: Simple Raters
    base_url: https://api.beazley.com/hack/raters/v1
    openapi: openapi/beazley-simple-raters.yml
    product: Prerelease
    mirrors: null
    note: >-
      Not on the /sandbox/ path but explicitly a test surface — Beazley describes it as a "Set of
      super-simple raters for testing" and it is sold through the Prerelease product.
health_checks:
  description: >-
    Three families expose an unauthenticated-shaped ping/health operation useful for verifying a
    sandbox subscription end to end before sending real risk data.
  operations:
    - openapi/beazley-data-capture-quote-and-risk-data-v2-sandbox.yml#5538d88d97fe1e0ff06f4247
    - openapi/beazley-broker-and-insured-marketing-data-v2-sandbox.yml#561e208f8097920ed881e641
    - openapi/beazley-compliance-web-api.yml#5893134739845516588448cc
test_data:
  published: false
  note: >-
    No test risk payloads, test broker/organisation ids, test currency dates or magic identifiers are
    published anywhere in the portal or the specs. Sandbox data is presumably seeded per partner at
    approval time. Nothing is invented here.
access:
  self_serve: false
  approval_required: true
  note: The Development products are approval-gated exactly like the Production products.
