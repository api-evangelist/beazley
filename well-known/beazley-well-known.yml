source: live probes of the Beazley website, developer portal and API gateway hosts
description: >-
  Beazley serves no /.well-known/ discovery surface on any of its three hosts. The corporate site
  www.beazley.com answers HTTP 200 to every path because unknown paths fall through to a soft-404
  page (<title>404 error page | beazley</title>), so a 200 there is a miss, not a hit — every probe
  below was confirmed by title, not by status code. developer.beazley.com is an Azure API Management
  developer portal and returns its own 404 shell; api.beazley.com is the APIM gateway and returns the
  APIM error envelope {"statusCode": 404, "message": "Resource not found"}. No security.txt, no OIDC
  or OAuth authorization-server metadata (consistent with API-key-only auth), no RFC 9727 api-catalog
  and no ai-plugin.json.
